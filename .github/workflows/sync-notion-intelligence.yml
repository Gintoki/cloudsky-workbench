name: Sync Notion Intelligence

on:
  schedule:
    - cron: "10 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Notion to database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_INDUSTRY_RADAR_ROOT_PAGE_ID: ${{ vars.NOTION_INDUSTRY_RADAR_ROOT_PAGE_ID || '3ac46ba20d9a8144ba0ae53e401dd80a' }}
          NOTION_SYNC_SNAPSHOT_PATH: ${{ vars.SYNC_COMMIT_SNAPSHOT == 'true' && 'data/notion-intelligence-snapshot.json' || '' }}
        run: npm run sync:notion

      - name: Commit optional snapshot
        if: ${{ vars.SYNC_COMMIT_SNAPSHOT == 'true' }}
        run: |
          if [ -z "$(git status --porcelain data/notion-intelligence-snapshot.json)" ]; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notion-intelligence-snapshot.json
          git commit -m "chore: sync Notion intelligence snapshot"
          git push